<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archiwum — Klub Przyjaciół EC2</title>
  <meta name="description" content="Archiwum skoroszytów i dokumentów Klubu Przyjaciół EC2 — digitalizacja dokumentacji technicznej elektrociepłowni EC2." />
  <link rel="icon" href="logo_czarne.png" id="favicon" />
  <link rel="stylesheet" href="styles.css" />
  <script src="common.js" defer></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
    <div class="container">
      <h1 class="page-title">Archiwum</h1>
      <p class="page-subtitle">Skoroszyty i dokumenty z archiwum EC2</p>

      <div id="archiveView">
        <div class="archive-list" id="archiveList"></div>
        <div id="looseDocsSection"></div>
      </div>

      <div id="skoroszytView" class="hidden">
        <button type="button" class="btn btn--ghost btn--small" id="backToArchiveBtn">&larr; Wróć do archiwum</button>
        <div class="skoroszyt-header">
          <h2 id="skoroszytSig"></h2>
          <div class="meta" id="skoroszytMeta"></div>
          <div class="desc" id="skoroszytDesc"></div>
        </div>
        <div class="skoroszyt-docs" id="skoroszytDocs"></div>
      </div>

      <div id="documentView" class="hidden">
        <button type="button" class="btn btn--ghost btn--small" id="backToParentBtn">&larr; Wróć</button>
        <div class="doc-header">
          <h2 id="docTitle"></h2>
          <div class="doc-header__meta" id="docMeta"></div>
        </div>
        <div class="tabs" role="tablist" id="docTabs">
          <button type="button" class="tab active" data-tab="analiza" role="tab">Analiza</button>
          <button type="button" class="tab" data-tab="transkrypcja" role="tab">Transkrypcja</button>
          <button type="button" class="tab" data-tab="skany" role="tab">Skany</button>
        </div>
        <div id="tabContent"></div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script>
  (function () {
    let DATA = null;
    let currentSource = 'archive';
    let currentSkoroszytId = null;
    let currentDocId = null;
    let activeTab = 'analiza';

    const archiveView = document.getElementById('archiveView');
    const skoroszytView = document.getElementById('skoroszytView');
    const documentView = document.getElementById('documentView');
    const archiveList = document.getElementById('archiveList');
    const looseDocsSection = document.getElementById('looseDocsSection');
    const skoroszytSig = document.getElementById('skoroszytSig');
    const skoroszytMeta = document.getElementById('skoroszytMeta');
    const skoroszytDesc = document.getElementById('skoroszytDesc');
    const skoroszytDocs = document.getElementById('skoroszytDocs');
    const docTitle = document.getElementById('docTitle');
    const docMeta = document.getElementById('docMeta');
    const tabContent = document.getElementById('tabContent');
    const docTabs = document.getElementById('docTabs');

    function esc(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function showArchiveView() {
      archiveView.classList.remove('hidden');
      skoroszytView.classList.add('hidden');
      documentView.classList.add('hidden');
      currentSource = 'archive';
      currentSkoroszytId = null;
      currentDocId = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSkoroszytView() {
      archiveView.classList.add('hidden');
      skoroszytView.classList.remove('hidden');
      documentView.classList.add('hidden');
      currentSource = 'skoroszyt';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showDocumentView() {
      archiveView.classList.add('hidden');
      skoroszytView.classList.add('hidden');
      documentView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderArchive() {
      archiveList.innerHTML = '';

      if (!DATA.skoroszyty || DATA.skoroszyty.length === 0) {
        archiveList.innerHTML = '<div class="empty">Brak skoroszytów w archiwum.</div>';
      } else {
        DATA.skoroszyty.forEach(function (s) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'archive-card';
          const docCount = (s.zawartosc || []).filter(function (i) { return i.typ === 'dokument'; }).length;

          let metaParts = [];
          if (s.rok) metaParts.push(s.rok);
          if (s.tom) metaParts.push(s.tom);

          btn.innerHTML =
            '<div class="archive-card__sig">' + esc(s.sygnatura) + '</div>'
            + (s.projekt ? '<div class="archive-card__projekt">' + esc(s.projekt) + '</div>' : '')
            + '<div class="archive-card__meta">'
            +   metaParts.map(function (p) { return '<span>' + esc(p) + '</span>'; }).join('')
            + '</div>'
            + '<div class="archive-card__desc">' + esc(s.opis || '') + '</div>'
            + '<div class="archive-card__count">' + docCount + ' ' + (docCount === 1 ? 'dokument' : 'dokumenty') + '</div>';
          btn.addEventListener('click', function () {
            currentSkoroszytId = s.id;
            renderSkoroszyt(s.id);
            showSkoroszytView();
          });
          archiveList.appendChild(btn);
        });
      }

      looseDocsSection.innerHTML = '';
      const loose = DATA.dokumenty_bez_skoroszytu || [];
      if (loose.length > 0) {
        const title = document.createElement('h2');
        title.className = 'archive-section-title';
        title.textContent = 'Dokumenty poza skoroszytami';
        looseDocsSection.appendChild(title);

        const wrap = document.createElement('div');
        wrap.className = 'skoroszyt-docs';
        loose.forEach(function (docId) {
          const doc = DATA.dokumenty[docId];
          if (!doc) return;
          wrap.appendChild(buildDocRow(docId, doc, 'loose'));
        });
        looseDocsSection.appendChild(wrap);
      }
    }

    function renderSkoroszyt(id) {
      const s = DATA.skoroszyty.find(function (x) { return x.id === id; });
      if (!s) return;

      skoroszytSig.textContent = 'Skoroszyt ' + s.sygnatura;
      skoroszytMeta.textContent = (s.rok ? 'Rok ' + s.rok : '');
      skoroszytDesc.textContent = s.opis || '';

      skoroszytDocs.innerHTML = '';
      const items = s.zawartosc || [];
      if (items.length === 0) {
        skoroszytDocs.innerHTML = '<div class="empty" style="border:none;">Skoroszyt jest pusty.</div>';
        return;
      }

      let counter = 0;
      items.forEach(function (item) {
        if (item.typ === 'dokument') {
          const doc = DATA.dokumenty[item.id];
          if (!doc) return;
          counter++;
          skoroszytDocs.appendChild(buildDocRow(item.id, doc, 'skoroszyt', counter));
        } else {
          counter++;
          const row = document.createElement('div');
          row.className = 'doc-row';
          row.innerHTML =
            '<div class="doc-row__num">' + counter + '.</div>'
            + '<div class="doc-row__main">'
            +   '<div class="doc-row__title">' + esc(item.tytul || 'Pozycja') + '</div>'
            +   '<div class="doc-row__meta">' + esc(item.opis || 'Nie zdygitalizowano') + '</div>'
            + '</div>';
          skoroszytDocs.appendChild(row);
        }
      });
    }

    function buildDocRow(id, doc, source, num) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'doc-row';
      btn.innerHTML =
        (num ? '<div class="doc-row__num">' + num + '.</div>' : '')
        + '<div class="doc-row__main">'
        +   '<div class="doc-row__title">' + esc(doc.tytul) + '</div>'
        +   '<div class="doc-row__meta">' + esc(doc.sygnatura) + ' · ' + esc(doc.data) + ' · ' + esc(doc.autor) + '</div>'
        + '</div>'
        + '<div class="doc-row__arrow">&rarr;</div>';
      btn.addEventListener('click', function () {
        currentSource = source;
        currentDocId = id;
        activeTab = 'analiza';
        renderDocument(id);
        showDocumentView();
      });
      return btn;
    }

    function renderDocument(id) {
      const doc = DATA.dokumenty[id];
      if (!doc) return;

      docTitle.textContent = doc.tytul;
      docMeta.innerHTML =
        '<span>' + esc(doc.sygnatura) + '</span>'
        + (doc.data ? '<span>' + esc(doc.data) + '</span>' : '')
        + (doc.autor ? '<span>' + esc(doc.autor) + '</span>' : '')
        + (doc.typ ? '<span>' + esc(doc.typ) + '</span>' : '')
        + (doc.strony ? '<span>' + esc(doc.strony) + ' str.</span>' : '');

      docTabs.querySelectorAll('.tab').forEach(function (t) {
        t.classList.toggle('active', t.dataset.tab === activeTab);
      });

      renderTabContent();
    }

    function renderTabContent() {
      const doc = DATA.dokumenty[currentDocId];
      if (!doc) return;
      tabContent.innerHTML = '';

      if (activeTab === 'analiza') {
        const wrap = document.createElement('div');
        wrap.className = 'prose prose--narrow';
        const paras = Array.isArray(doc.analiza) ? doc.analiza : (doc.analiza ? [doc.analiza] : []);
        if (paras.length === 0) {
          wrap.innerHTML = '<div class="empty" style="border:none;">Analiza jeszcze nie została przygotowana.</div>';
        } else {
          paras.forEach(function (p) {
            const el = document.createElement('p');
            el.textContent = p;
            wrap.appendChild(el);
          });
        }
        tabContent.appendChild(wrap);
      }

      else if (activeTab === 'transkrypcja') {
        const parts = Array.isArray(doc.transkrypcja)
          ? doc.transkrypcja
          : (doc.transkrypcja ? [{ src: doc.transkrypcja, label: 'Transkrypcja' }] : []);

        if (parts.length === 0) {
          tabContent.innerHTML = '<div class="empty" style="border:none;">Transkrypcja jeszcze nie została przygotowana.</div>';
          return;
        }

        parts.forEach(function (part) {
          const wrap = document.createElement('div');
          wrap.className = 'transcription-part';
          
          const label = document.createElement('div');
          label.className = 'transcription-part__label';
          label.textContent = part.label || 'Transkrypcja';
          wrap.appendChild(label);

          const iframe = document.createElement('iframe');
          iframe.className = 'transcription-frame';
          iframe.src = part.src;
          iframe.title = part.label || 'Transkrypcja';
          iframe.loading = 'lazy';
          
          iframe.addEventListener('load', function() {
            try {
              const docIframe = iframe.contentDocument || iframe.contentWindow.document;
              if (docIframe && !docIframe.getElementById('mobile-fix-style')) {
                const style = docIframe.createElement('style');
                style.id = 'mobile-fix-style';
                style.textContent = `
                  @media (max-width: 800px) {
                    body { margin: 12px !important; font-size: 14px !important; }
                    h1 { font-size: 1.4em !important; margin-top: 15px !important; }
                    h2 { font-size: 1.2em !important; margin-top: 15px !important; }
                    h3, h4 { font-size: 1.1em !important; margin-top: 15px !important; }
                    table { display: block !important; width: 100% !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; margin-bottom: 15px !important; border: 1px solid #ccc !important; }
                    th, td { padding: 6px !important; font-size: 13px !important; min-width: 80px !important; }
                    .header-table { display: block !important; border: none !important; margin-bottom: 10px !important; }
                    .header-table tbody { display: block !important; }
                    .header-table tr { display: flex !important; flex-direction: column !important; }
                    .header-table td { border: none !important; padding: 2px 0 !important; text-align: left !important; min-width: 0 !important; }
                    .header-table td[style*="text-align: right"] { text-align: left !important; }
                    .data-table, .bom-table, table[style] { display: block !important; overflow-x: auto !important; }
                    .formula, .formula-box { font-size: 12px !important; padding: 10px !important; overflow-x: auto !important; white-space: pre-wrap !important; word-break: break-word !important; }
                    .page { padding-bottom: 20px !important; margin-bottom: 20px !important; }
                    .signature-box { flex-direction: column !important; gap: 20px !important; }
                    .signature { width: 100% !important; margin: 0 !important; }
                    .typewriter { white-space: pre-wrap !important; word-break: break-word !important; }
                    .fraction { transform: scale(0.8); display: inline-block; }
                  }
                `;
                docIframe.head.appendChild(style);
              }
            } catch (e) {
              console.warn('Nie można wstrzyknąć stylów do iframe:', e);
            }
          });

          wrap.appendChild(iframe);
          tabContent.appendChild(wrap);
        });
      }

      else if (activeTab === 'skany') {
        const scans = doc.skany || [];
        if (scans.length === 0) {
          tabContent.innerHTML = '<div class="empty" style="border:none;">Skany jeszcze nie zostały dodane.</div>';
          return;
        }
        const grid = document.createElement('div');
        grid.className = 'scans-grid';
        scans.forEach(function (scan, i) {
          const src = typeof scan === 'string' ? scan : scan.src;
          const label = typeof scan === 'string' ? ('Strona ' + (i + 1)) : (scan.label || ('Strona ' + (i + 1)));
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'scan-card';
          btn.innerHTML =
            '<img src="' + esc(src) + '" alt="' + esc(label) + '" loading="lazy" />'
            + '<div class="scan-card__label">' + esc(label) + '</div>';
          btn.addEventListener('click', function () { window.open(src, '_blank'); });
          grid.appendChild(btn);
        });
        tabContent.appendChild(grid);
      }
    }

    document.getElementById('backToArchiveBtn').addEventListener('click', showArchiveView);

    document.getElementById('backToParentBtn').addEventListener('click', function () {
      if (currentSource === 'skoroszyt' && currentSkoroszytId) {
        showSkoroszytView();
      } else {
        showArchiveView();
      }
    });

    docTabs.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        activeTab = tab.dataset.tab;
        docTabs.querySelectorAll('.tab').forEach(function (t) {
          t.classList.toggle('active', t === tab);
        });
        renderTabContent();
      });
    });

    fetch('archiwum.json')
      .then(function (response) {
        if (!response.ok) throw new Error('Nie udało się załadować archiwum.json');
        return response.json();
      })
      .then(function (data) {
        DATA = data;
        renderArchive();
      })
      .catch(function (error) {
        console.error(error);
        archiveList.innerHTML = '<div class="empty">Nie udało się załadować danych archiwum. Spróbuj odświeżyć stronę.</div>';
      });
  })();
  </script>
</body>
</html>
