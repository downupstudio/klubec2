<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista członków — Klub Przyjaciół EC2</title>
  <meta name="description" content="Lista członków Klubu Przyjaciół EC2 — dołącz do nas." />
  <link rel="icon" href="logo_czarne.png" id="favicon" />
  <link rel="stylesheet" href="styles.css" />
  <script src="common.js" defer></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
    <div class="container" style="max-width: 900px;">
      <h1 class="page-title">Lista członków</h1>
      <p class="page-subtitle">Poznaj społeczność Klubu Przyjaciół EC2</p>

      <button class="btn" id="showFormBtn" style="margin-bottom:20px;">+ Zapisz się do klubu</button>
      <div id="message" class="msg"></div>

      <div class="form hidden" id="formSection">
        <div class="form__title">Formularz zgłoszeniowy</div>
        <form id="memberForm">
          <div class="form-row">
            <label class="form-label" for="nick">Nick <span class="required">*</span></label>
            <input type="text" id="nick" class="form-input" required placeholder="Twój pseudonim" />
          </div>
          <div class="form-row">
            <label class="form-label" for="miejscowosc">Miejscowość <span class="required">*</span></label>
            <input type="text" id="miejscowosc" class="form-input" required placeholder="Skąd jesteś?" />
          </div>
          <div class="form-row form-row--half">
            <div>
              <label class="form-label" for="imie">Imię</label>
              <input type="text" id="imie" class="form-input" placeholder="Opcjonalnie" />
            </div>
            <div>
              <label class="form-label" for="nazwisko">Nazwisko</label>
              <input type="text" id="nazwisko" class="form-input" placeholder="Opcjonalnie" />
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="grupa">Grupa urbexowa</label>
            <input type="text" id="grupa" class="form-input" placeholder="Nazwa Twojej grupy (opcjonalnie)" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn">Zapisz się</button>
            <button type="button" class="btn btn--ghost" id="cancelBtn">Anuluj</button>
          </div>
        </form>
      </div>

      <div id="membersList">
        <div class="loading" id="loading">Ładowanie listy członków…</div>
        <div class="table-wrap hidden" id="tableWrapper">
          <table>
            <thead>
              <tr>
                <th>Nick</th>
                <th>Miejscowość</th>
                <th>Imię</th>
                <th>Grupa</th>
                <th>Data dołączenia</th>
              </tr>
            </thead>
            <tbody id="membersTableBody"></tbody>
          </table>
        </div>
        <div class="empty hidden" id="emptyState"></div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
  (function () {
    const firebaseConfig = {
      apiKey: "AIzaSyC8pI8HsPVxrFoa9ndn66KHVQeS1a6F10o",
      authDomain: "klub-ec2.firebaseapp.com",
      projectId: "klub-ec2",
      storageBucket: "klub-ec2.firebasestorage.app",
      messagingSenderId: "858186765208",
      appId: "1:858186765208:web:3062bcd07c2c7cef8fd1ed"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const loading = document.getElementById('loading');
    const tableWrapper = document.getElementById('tableWrapper');
    const emptyState = document.getElementById('emptyState');
    const tbody = document.getElementById('membersTableBody');
    const formSection = document.getElementById('formSection');
    const showFormBtn = document.getElementById('showFormBtn');
    const memberForm = document.getElementById('memberForm');

    async function loadMembers() {
      try {
        const snapshot = await db.collection('czlonkowie').orderBy('data', 'desc').get();
        const members = [];
        snapshot.forEach(doc => members.push(doc.data()));
        renderMembers(members);
      } catch (error) {
        console.error('Błąd ładowania:', error);
        loading.classList.add('hidden');
        tableWrapper.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.innerHTML = '<p>Nie udało się załadować listy</p><p class="sub" style="font-size:0.62rem;opacity:0.5;margin-top:8px;">Spróbuj odświeżyć stronę</p>';
      }
    }

    function renderMembers(members) {
      loading.classList.add('hidden');
      if (members.length === 0) {
        tableWrapper.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.innerHTML = '<p>Brak członków</p><p class="sub" style="font-size:0.62rem;opacity:0.5;margin-top:8px;">Bądź pierwszy! Zapisz się do klubu.</p>';
        return;
      }
      tableWrapper.classList.remove('hidden');
      emptyState.classList.add('hidden');
      tbody.innerHTML = members.map(m => `
        <tr>
          <td><strong>${m.nick || '—'}</strong></td>
          <td>${m.miejscowosc || '—'}</td>
          <td>${m.imie || '—'}</td>
          <td>${m.grupa || '—'}</td>
          <td>${m.data || '—'}</td>
        </tr>
      `).join('');
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'msg msg--' + type;
      setTimeout(() => { msg.className = 'msg'; }, 5000);
    }

    showFormBtn.addEventListener('click', () => {
      const open = !formSection.classList.contains('hidden');
      formSection.classList.toggle('hidden');
      showFormBtn.textContent = open ? '+ Zapisz się do klubu' : '✕ Zamknij formularz';
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      formSection.classList.add('hidden');
      showFormBtn.textContent = '+ Zapisz się do klubu';
      memberForm.reset();
    });

    memberForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nick = document.getElementById('nick').value.trim();
      const miejscowosc = document.getElementById('miejscowosc').value.trim();
      const imie = document.getElementById('imie').value.trim();
      const nazwisko = document.getElementById('nazwisko').value.trim();
      const grupa = document.getElementById('grupa').value.trim();

      if (!nick || !miejscowosc) {
        showMessage('Nick i miejscowość są wymagane!', 'error');
        return;
      }

      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        const userIP = ipData.ip;

        const existing = await db.collection('czlonkowie').where('ip', '==', userIP).get();
        if (!existing.empty) {
          showMessage('Już jesteś zapisany z tego adresu IP!', 'error');
          return;
        }

        await db.collection('czlonkowie').add({
          nick, miejscowosc,
          imie: imie || '',
          nazwisko: nazwisko || '',
          grupa: grupa || '',
          ip: userIP,
          data: new Date().toISOString().split('T')[0],
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        showMessage('Dołączyłeś do klubu! Witamy!', 'success');
        memberForm.reset();
        formSection.classList.add('hidden');
        showFormBtn.textContent = '+ Zapisz się do klubu';
        loadMembers();
      } catch (error) {
        console.error('Błąd:', error);
        showMessage('Nie udało się zapisać. Spróbuj później.', 'error');
      }
    });

    loadMembers();
  })();
  </script>
</body>
</html>
