<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria — Klub Przyjaciół EC2</title>
  <meta name="description" content="Galeria zdjęć związanych z Elektrociepłownią EC2 w Łodzi — archiwum klubowe i wyprawy." />
  <link rel="icon" href="logo_czarne.png" id="favicon" />
  <link rel="stylesheet" href="styles.css" />
  <script src="common.js" defer></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
    <div class="container">
      <h1 class="page-title">Galeria</h1>
      <p class="page-subtitle">Zdjęcia związane z EC2</p>

      <div id="albumListView">
        <div class="album-grid">
          <button type="button" class="album-card" data-album="1">
            <div class="album-card__thumb">
              <img src="https://www.fotofestiwal.com/2012/wp-content/uploads/2012/06/DSC3126.jpg" alt="Fotospacer z Dalkią — Fotofestiwal 2012" loading="lazy" />
            </div>
            <div class="album-card__info">
              <div class="album-card__title">Fotospacer z Dalkią „Czas energii EC2" podczas Fotofestiwalu 2012</div>
              <div class="album-card__desc">Zdjęcia z Fotofestiwalu 2012.</div>
              <div class="album-card__meta">7 zdjęć · 2012</div>
            </div>
          </button>

          <button type="button" class="album-card" data-album="22">
            <div class="album-card__thumb">
              <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEik2BqB7BavCO3mwJok1stW35InV1rjVepiUpqwYvXV1-G9Rkkw9rlpVUSFzSZ9JxMB60U2yyugd7b3GSOMItCZWWsSg8dR8_VPBF_TW70xTwh0ZbWnWs7pZ7_vx87_H6Q89dH56LNY4_fH/s640/DSC_2268.jpg" alt="EC2 w zimie 2018/2019" loading="lazy" />
            </div>
            <div class="album-card__info">
              <div class="album-card__title">EC2 w zimie 2018/2019</div>
              <div class="album-card__desc">Zdjęcia z wyprawy Penetrator Scavenger Team na EC2.</div>
              <div class="album-card__meta">7 zdjęć · 2020</div>
            </div>
          </button>
        </div>
      </div>

      <div id="albumView" class="hidden">
        <button type="button" class="btn btn--ghost btn--small" id="backBtn">&larr; Powrót do albumów</button>
        <div class="album-view__header">
          <h2 id="albumTitle"></h2>
          <p id="albumDesc"></p>
        </div>
        <div class="photo-grid" id="albumGrid"></div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <div class="lightbox" id="lightbox" data-open="false" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia">
    <div class="lightbox__bar">
      <span class="lightbox__counter" id="lightboxCounter"></span>
      <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Zamknij podgląd">✕ Zamknij</button>
    </div>
    <div class="lightbox__body">
      <button type="button" class="lightbox__nav" id="lightboxPrev" aria-label="Poprzednie zdjęcie">‹</button>
      <div class="lightbox__stage">
        <img class="lightbox__img" id="lightboxImg" src="" alt="" data-ready="false" />
      </div>
      <button type="button" class="lightbox__nav" id="lightboxNext" aria-label="Następne zdjęcie">›</button>
    </div>
    <div class="lightbox__foot">
      <div class="lightbox__title" id="lightboxAuthor"></div>
      <div class="lightbox__desc" id="lightboxDesc"></div>
    </div>
  </div>

  <script>
  (function () {
    const albums = {
      1: {
        title: 'Fotospacer z Dalkią „Czas energii EC2" podczas Fotofestiwalu 2012.',
        desc: 'Zdjęcia z Fotofestiwalu 2012.',
        photos: [
          { src: 'https://www.fotofestiwal.com/2012/wp-content/gallery/sesja-ec2/Krzysztof-Eberle-3.jpg', author: 'Krzysztof Eberle', desc: 'Główny pulpit nastawni EC2 podczas Fotofestiwalu 2012.' },
          { src: 'https://www.fotofestiwal.com/2012/wp-content/gallery/sesja-ec2/Krzysztof-Eberle-4.jpg', author: 'Krzysztof Eberle', desc: 'Maszynownia EC2 z widocznym turbozespołem nr 4 podczas Fotofestiwalu 2012.' },
          { src: 'https://www.fotofestiwal.com/2012/wp-content/gallery/sesja-ec2/Krzysztof-Eberle.jpg', author: 'Krzysztof Eberle', desc: 'Kotłownia EC2 podczas Fotofestiwalu 2012.' },
          { src: 'https://www.fotofestiwal.com/2012/wp-content/gallery/sesja-ec2/Maciej-Sobczyk-3.jpg', author: 'Maciej Sobczyk', desc: 'Nastawnia EC2 podczas Fotofestiwalu 2012.' },
          { src: 'https://www.fotofestiwal.com/2012/wp-content/gallery/sesja-ec2/Maciej-Sobczyk.jpg', author: 'Maciej Sobczyk', desc: 'Wnętrze północnej chłodni kominowej EC2 podczas Fotofestiwalu 2012.' },
          { src: 'https://www.fotofestiwal.com/2012/wp-content/gallery/sesja-ec2/Tomasz-Dobrakowski.JPG', author: 'Tomasz Dobrakowski', desc: 'Kominy EC2 podczas Fotofestiwalu 2012.' },
          { src: 'https://www.fotofestiwal.com/2012/wp-content/gallery/sesja-ec2/stanislaw-wronski-2.jpg', author: 'Stanisław Wroński', desc: 'Przechowywalnia znaków ostrzegawczych EC2 podczas Fotofestiwalu 2012.' }
        ]
      },
      22: {
        title: 'EC2 w zimie 2018/2019',
        desc: 'Zdjęcia z wyprawy Penetrator Scavenger Team na EC2.',
        photos: [
          { src: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEik2BqB7BavCO3mwJok1stW35InV1rjVepiUpqwYvXV1-G9Rkkw9rlpVUSFzSZ9JxMB60U2yyugd7b3GSOMItCZWWsSg8dR8_VPBF_TW70xTwh0ZbWnWs7pZ7_vx87_H6Q89dH56LNY4_fH/s640/DSC_2268.jpg', author: 'Penetrator Scavenger Team', desc: 'Widok na całe EC2 od strony zachodniej, zima 2018/2019.' },
          { src: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjoc5XxGGI5GOFVbEjToBETH5ltFM-vdPgtZQgKIuc9YHrJOXSyEPVjVo6cXfkSPjLZDKIkwgN4KSKaqE6O2M8YmYIRxRxI5YqzqOshy8ulOMX9-VKqAasL9TiEKNKLKY4NYcBaGyjm4FhT/s640/DSC_2322.jpg', author: 'Penetrator Scavenger Team', desc: 'Maszynownia EC2 z widocznym turbozespołem nr 4, zima 2018/2019.' },
          { src: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEilczrbs4jYRiUrmR68NEWqQvIch1naMImeTV-Tz0DpxtcKrO-NiDtH1arQSTTdRtVo4SXkY873EWjMnmisqEOGI_kcsRxyxaEXRYusxif1H8yBYJ_smI7Rjnz3hWGnG3p0I55EB1ms2Sep/s640/DSC_2324.jpg', author: 'Penetrator Scavenger Team', desc: 'Jeden z pokojów kontrolnych przy maszynowni EC2, zima 2018/2019.' },
          { src: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEguaID-VqT1pCEzPwGyDqPB9HBBeQaxtHu83u6JoGztWznOwBLQjhxtspQ66ALjbdQtduxAbP9rncwc-B1Aus4DtFhNd9MUTP51wYNXCx-emI6PRnrRLQbMIFCsJbI2VGlI2Uz_1Kdewu3L/s640/DSC_2326.jpg', author: 'Penetrator Scavenger Team', desc: 'Turbogenerator nr 4 w maszynowni EC2, zima 2018/2019.' },
          { src: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi8gdeZKNwZROvCQPNySHfPrsWIsmjW_yV6oUbzKDrq6SE5xQkhF7CFjEh82xGtdSFpPv4UE_6uONKEGyM_R9XfNa4YsTWuRegL5H3d4gK_9nwvWIqbFFt71DfetZxvCadXFPMVfmyVBCzW/s640/DSC_2349.jpg', author: 'Penetrator Scavenger Team', desc: 'Kolektory dolotowe turbozespołu nr 5 w maszynowni EC2, zima 2018/2019.' },
          { src: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhk61k8d2TNG1jX-7pEOpPVXLt4bSDtEIeCqbLZBBduZqcrxW1RjX4-UOv37T3Z0qBz-0TOj6HgulCb1pleaHqZdggY8ITjFDpISd-SX-P3YTdmat2dnbx6_4Mcqy1wBJ-Tgw_wpSM7WIIa/s640/DSC_2350.jpg', author: 'Penetrator Scavenger Team', desc: 'Nastawnia EC2, zima 2018/2019.' },
          { src: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjPLCPaMpPf7-DnI-2pjDYlV5rS0YyPOuge5u2SUFpRq7fQrF2XJPyfcRS5bt1sK1283QpCVuu9ROnpL7LbRS8nK0LewMOkL9CE8ssdZzvsm3rdDFZo1FUPOAjtGcjBkvW0aCEpua7sHDPF/s640/DSC_2300.jpg', author: 'Penetrator Scavenger Team', desc: 'Kotłownia EC2, zima 2018/2019.' }
        ]
      }
    };

    const albumListView = document.getElementById('albumListView');
    const albumView = document.getElementById('albumView');
    const albumGrid = document.getElementById('albumGrid');
    const albumTitle = document.getElementById('albumTitle');
    const albumDesc = document.getElementById('albumDesc');
    const backBtn = document.getElementById('backBtn');

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxAuthor = document.getElementById('lightboxAuthor');
    const lightboxDesc = document.getElementById('lightboxDesc');
    const lightboxCounter = document.getElementById('lightboxCounter');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');

    let currentPhotos = [];
    let currentIndex = 0;

    function openLightbox(photos, index) {
      currentPhotos = photos;
      currentIndex = index;
      updateLightbox();
      lightbox.dataset.open = 'true';
      document.body.style.overflow = 'hidden';
      lightboxClose.focus();
    }

    function closeLightbox() {
      lightbox.dataset.open = 'false';
      document.body.style.overflow = '';
    }

    function updateLightbox() {
      const photo = currentPhotos[currentIndex];
      lightboxImg.dataset.ready = 'false';
      lightboxImg.alt = photo.desc;
      if (lightboxImg.getAttribute('data-loaded') !== photo.src) {
        lightboxImg.src = photo.src;
        lightboxImg.setAttribute('data-loaded', photo.src);
      }
      if (lightboxImg.complete) {
        lightboxImg.dataset.ready = 'true';
      } else {
        lightboxImg.onload = function () { lightboxImg.dataset.ready = 'true'; };
      }
      lightboxAuthor.textContent = 'fot. ' + photo.author;
      lightboxDesc.textContent = photo.desc;
      lightboxCounter.textContent = (currentIndex + 1) + ' / ' + currentPhotos.length;
      lightboxPrev.style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
      lightboxNext.style.visibility = currentIndex === currentPhotos.length - 1 ? 'hidden' : 'visible';
    }

    function prevPhoto() { if (currentIndex > 0) { currentIndex--; updateLightbox(); } }
    function nextPhoto() { if (currentIndex < currentPhotos.length - 1) { currentIndex++; updateLightbox(); } }

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', prevPhoto);
    lightboxNext.addEventListener('click', nextPhoto);

    document.addEventListener('keydown', function (e) {
      if (lightbox.dataset.open !== 'true') return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') prevPhoto();
      if (e.key === 'ArrowRight') nextPhoto();
    });

    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });

    function showAlbum(albumId) {
      const album = albums[albumId];
      if (!album) return;

      albumTitle.textContent = album.title;
      albumDesc.textContent = album.desc;

      albumGrid.innerHTML = album.photos.map(function (photo, index) {
        return '<button type="button" class="photo-card" data-index="' + index + '">'
          + '<div class="photo-card__img"><img src="' + photo.src + '" alt="' + photo.desc.replace(/"/g, '&quot;') + '" loading="lazy" /></div>'
          + '<div class="photo-card__body">'
          +   '<div class="photo-card__author">fot. ' + photo.author + '</div>'
          +   '<div class="photo-card__desc">' + photo.desc + '</div>'
          + '</div>'
          + '</button>';
      }).join('');

      albumGrid.querySelectorAll('.photo-card').forEach(function (card) {
        card.addEventListener('click', function () {
          openLightbox(album.photos, parseInt(card.dataset.index, 10));
        });
      });

      albumListView.classList.add('hidden');
      albumView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showAlbumList() {
      albumView.classList.add('hidden');
      albumListView.classList.remove('hidden');
      closeLightbox();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('.album-card').forEach(function (card) {
      card.addEventListener('click', function () { showAlbum(card.dataset.album); });
    });

    backBtn.addEventListener('click', showAlbumList);
  })();
  </script>
</body>
</html>
