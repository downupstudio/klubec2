<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt — Klub Przyjaciół EC2</title>

  <div id="header-placeholder"></div>
  <main>
    <div class="container" style="max-width: 760px;">

              <a href="mailto:klubprzyjaciolec2@gmail.com">klubprzyjaciolec2@gmail.com</a>
            </div>
          </div>

        <div class="contact-item">

            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Facebook_f_logo_%282019%29.svg/1280px-Facebook_f_logo_%282019%29.svg.png" alt="Facebook" />
          </div>

            <div class="contact-item__label">Facebook</div>
            <div class="contact-item__value">

  <div id="footer-placeholder"></div>
