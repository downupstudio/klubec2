<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wideo — Klub Przyjaciół EC2</title>
  <meta name="description" content="Filmy związane z Elektrociepłownią EC2 w Łodzi — wiadomości, eksploracja, wspinaczka, dron." />
  <link rel="icon" href="logo_czarne.png" id="favicon" />
  <link rel="stylesheet" href="styles.css" />
  <script src="common.js" defer></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
    <div class="container">
      <h1 class="page-title">Wideo</h1>
      <p class="page-subtitle">Filmy związane z EC2</p>

      <div id="categoryListView">
        <div class="video-categories">
          <button class="video-category" data-category="news">
            <div class="video-category__name">Wiadomości</div>
            <div class="video-category__count">1 film</div>
          </button>
          <button class="video-category" data-category="exploration">
            <div class="video-category__name">Eksploracja</div>
            <div class="video-category__count">3 filmy</div>
          </button>
          <button class="video-category" data-category="climbing">
            <div class="video-category__name">Wspinaczka</div>
            <div class="video-category__count">3 filmy</div>
          </button>
          <button class="video-category" data-category="drone">
            <div class="video-category__name">Z lotu ptaka</div>
            <div class="video-category__count">3 filmy</div>
          </button>
        </div>
      </div>

      <div id="videoView" class="hidden">
        <button class="btn btn--ghost btn--small" id="backBtn" style="margin-bottom:24px;">&larr; Powrót do kategorii</button>
        <div style="margin-bottom:24px;">
          <h2 style="font-size:1.15rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;" id="categoryTitle"></h2>
          <p style="font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;opacity:0.55;" id="categoryDesc"></p>
        </div>
        <div class="video-list" id="videoGrid"></div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script>
  (function () {
    const categories = {
      news: {
        title: 'Wiadomości',
        desc: 'Filmy informacyjne i reportaże o EC2.',
        videos: [{
          embed: 'https://www.youtube.com/embed/ownffsdbqto',
          title: 'EC-2 znika z mapy Łodzi. Rozbiórka zabytkowej elektrociepłowni',
          author: 'TVP3 Łódź',
          desc: 'Z mapy Łodzi powoli znika jeden z symboli powojennego dziedzictwa przemysłowego. Chodzi o nieczynną od dekady Elektrociepłownię EC-2 przy ul. Wróblewskiego. Rozbiórka już się rozpoczęła. Sęk w tym, że sześć lat temu Wojewódzki Konserwator Zabytków wpisał EC-2 do rejestru zabytków, wskazując najcenniejsze elementy kompleksu. Teraz konserwator zmienił zdanie i wyraził zgodę na ich zrównanie z ziemią.'
        }]
      },
      exploration: {
        title: 'Eksploracja',
        desc: 'Filmy z wypraw i eksploracji EC2.',
        videos: [
          { embed: 'https://www.youtube.com/embed/2Bp4_qL1aQg', title: 'WIELKA OPUSZCZONA ELEKTROCIEPŁOWNIA - URBEX', author: 'Żądny Przygód', desc: 'Grudzień 2019. Eksploruję opuszczoną elektrociepłownię, gigantyczny, zabytkowy budynek pełen zakamarków i ciekawostek. To właśnie tutaj nagrywano teledysk do utworu Tamagotchi, którego autorami są TACONAFIDE czyli Quebonafide i Taco Hemingway. Ten hit podbił Polskę jakiś czas temu, teraz jednak miejsce w którym nagrywano do niego klip jest w dużej części zniszczone. Mimo wszytko, to co pozostało i tak stanowi sporą gratkę dla miłośników historii i eksploratorów.' },
          { embed: 'https://www.youtube.com/embed/e2Y6EaDTrfI', title: 'OPUSZCZONA ELEKTROCIEPŁOWNIA EC-2 - ŁÓDŹ - SMTE - UrbexPov', author: 'SMTE TV', desc: 'Kwiecień 2020. Witamy ponownie! W dzisiejszym odcinku odwiedzimy wspólnie elektrociepłownię EC-2 w Łodzi. Bardzo ciekawe miejsce. Po obiekcie oprowadza nas ekipa Explorersi Łdz, którą z całego serca pozdrawiamy. Zdrówka Mordeczki!' },
          { embed: 'https://www.youtube.com/embed/cDT-K09q6dA', title: 'GIGANTYCZNA OPUSZCZONA ELEKTROCIEPŁOWNIA "EC-2" | URBEX', author: 'iDraws | Urbex', desc: 'Październik 2025. Ja, @DoMiN53 i moi znajomi wyruszyliśmy pewnego dnia zwiedzić pewną elektrociepłownie.. mianowicie EC-2, zbudowane w 1958 dzialalo az do 2015. Zostalo sprzedane prywatnej firmie która zaczeła nielegalne wyburzanie budynku, ponieważ jest zabytkiem. Konserwator zabytków zgłosił tą firmę na prokuraturę, a elektrownia stoi opuszczona do dziś... Był tu też nagrywany pewien słynny teledysk ale o nim już w filmie ;)' }
        ]
      },
      climbing: {
        title: 'Wspinaczka',
        desc: 'Filmy ze wspinaczki na kominy i inne struktury EC2.',
        videos: [
          { embed: 'https://www.youtube.com/embed/T7d1PUj2i_w', title: 'Prace wysokościowe na terenie Elektrociepłowni (wszystko legalnie)', author: 'Krokodyl Vlog', desc: 'Lipiec 2023. Siema! 🐊 Wpadłem dzisiaj odwiedzić 3 piękne kominy elektrociepłowni Łódzkiej. Nieco utrudniony dostęp natomiast misja udała się bez zbędnych komplikacji. Zapraszam do oglądania.' },
          { embed: 'https://www.youtube.com/embed/gPEoNh-2zHo', title: 'GUALA 1: Wejście na chłodnię kominową Elektrociepłowni EC-2 w Łodzi', author: 'GUALA', desc: 'Lipiec 2026. Wejście na 64-metrową chłodnię kominową opuszczonej Elektrociepłowni EC-2 w Łodzi. Wspinaczka odbyła się bez asekuracji.' },
          { embed: 'https://www.youtube.com/embed/tEKKqZnHPuE', title: 'EC2 Łódź - Wejście Na Komin O Wschodzie Słońca', author: 'Krzysiek Bocheński', desc: 'Styczeń 2020. Wschód słońca na kominie EC2 w Łodzi.' }
        ]
      },
      drone: {
        title: 'Z lotu ptaka',
        desc: 'Filmy z drona przedstawiające EC2 z powietrza.',
        videos: [
          { embed: 'https://www.youtube.com/embed/sVjDUYtFnPk', title: 'Elektrociepłownia EC2 Łódź #urbex #foto #dron', author: 'Krzysztof Apanowicz', desc: 'Maj 2026. Film z drona przedstawiający EC2 w Łodzi z lotu ptaka.' },
          { embed: 'https://www.youtube.com/embed/3uc4UHkNZSc', title: '2024 EC-2 Łódź | Dron', author: 'Kerpy', desc: 'Lipiec 2024. Film z drona przedstawiający EC2 w Łodzi z lotu ptaka.' },
          { embed: 'https://www.youtube.com/embed/pqErKyQX4Os', title: '2022 EC2 Łódź Drone', author: 'ŁÓDZKIE MOCNE', desc: 'Listopad 2022. EC2 z lotu drona.' }
        ]
      }
    };

    const categoryListView = document.getElementById('categoryListView');
    const videoView = document.getElementById('videoView');
    const videoGrid = document.getElementById('videoGrid');
    const categoryTitle = document.getElementById('categoryTitle');
    const categoryDesc = document.getElementById('categoryDesc');
    const backBtn = document.getElementById('backBtn');

    function showCategory(key) {
      const cat = categories[key];
      if (!cat) return;
      categoryTitle.textContent = cat.title;
      categoryDesc.textContent = cat.desc;
      videoGrid.innerHTML = cat.videos.map(v => `
        <div class="video-item">
          <div class="video-item__embed">
            <iframe src="${v.embed}" allowfullscreen loading="lazy" title="${v.title.replace(/"/g,'&quot;')}"></iframe>
          </div>
          <div class="video-item__body">
            <div class="video-item__title">${v.title}</div>
            <div class="video-item__author">${v.author}</div>
            <div class="video-item__desc">${v.desc}</div>
          </div>
        </div>
      `).join('');
      categoryListView.classList.add('hidden');
      videoView.classList.remove('hidden');
    }

    function showCategoryList() {
      videoView.classList.add('hidden');
      categoryListView.classList.remove('hidden');
    }

    document.querySelectorAll('.video-category').forEach(btn => {
      btn.addEventListener('click', () => {
        showCategory(btn.dataset.category);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    backBtn.addEventListener('click', showCategoryList);
  })();
  </script>
</body>
</html>
